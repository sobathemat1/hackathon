name: Keep Supabase Alive
on:
  schedule:
    - cron: '0 2 */3 * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Health Endpoint
        run: |
          curl -f -s -H "x-health-secret: ${{ secrets.HEALTHCHECK_SECRET }}" \
            "${{ secrets.APP_URL }}/api/health" > /dev/null
